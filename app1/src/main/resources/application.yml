server:
  port: 8081
  servlet:
    # Defaults to /app1 locally too (not just DeployMate's injected SERVER_SERVLET_CONTEXT_PATH env
    # var), matching App1Controller's own bare @GetMapping("/aggregate")/("/standalone") mappings --
    # keeps this the ONE place that supplies the /app1 prefix in both environments, instead of
    # stacking a controller-level prefix on top of DeployMate's env var (that double-prefixing was
    # the AWS 404 bug). Locally the API gateway still forwards /app1/** unstripped (see its own
    # application.yml), so this default keeps `curl http://localhost:8080/app1/aggregate` working.
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/app1}

spring:
  application:
    name: app1
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app1}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # `update` keeps the demo runnable without a migration tool; switch to `validate`
      # (or none) once a real schema-migration story exists.
      ddl-auto: ${DB_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL:http://localhost:8761}/eureka
    # Azure Container Apps' internal service mesh appears to reject requests sent over a pooled
    # connection that's been held open a while (registration/the first call on a fresh connection
    # succeeds; every later periodic registry-fetch reusing that same connection gets a 403 from
    # discovery-server's own edge, never reaching the app -- see the demo repo's troubleshooting
    # notes). Forcing the client to recycle idle connections quickly works around it. No effect on
    # AWS -- this is pure client-side connection-reuse behavior, unrelated to how the request reaches
    # discovery-server.
    eureka-connection-idle-timeout-seconds: 5
  instance:
    prefer-ip-address: false
    hostname: ${SERVICE_HOSTNAME:localhost}
    nonSecurePort: ${SERVICE_ADVERTISE_PORT:8081}
